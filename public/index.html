<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writing Trainer</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell">
<header class="topbar"><div><div class="eyebrow">WRITING TRAINER</div><h1>Build real English writing.</h1></div><nav>
<button class="tab active" data-view="today">Today</button><button class="tab" data-view="review">Review</button><button class="tab" data-view="progress">Progress</button><button class="tab" data-view="history">History</button></nav></header>
<section id="todayView" class="view">
<div class="card hero"><div><h2 id="dayTitle">Today's Practice</h2><p id="dayMeta" class="muted"></p></div><div class="progress-wrap"><div id="progressText"></div><div class="progress"><div id="progressBar"></div></div></div></div>
<div class="card"><div class="question-top"><span id="type" class="pill"></span><span id="focus" class="pill"></span></div><h2 id="prompt"></h2><label>Write one complete English sentence:</label><textarea id="answer" spellcheck="true" placeholder="Type your sentence here..."></textarea>
<div class="actions"><button id="checkBtn" class="primary">Check with AI ↵</button><button id="hintBtn">Hint</button><button id="modelBtn">Model answer</button><button id="clearBtn">Clear</button></div>
<div id="loading" class="notice hidden">Checking your sentence…</div><div id="result" class="result hidden"></div><div id="hint" class="notice hint hidden"></div><div id="model" class="notice model hidden"></div>
<div class="nav"><button id="prevBtn">← Previous</button><span id="score" class="muted"></span><button id="nextBtn" class="primary">Next →</button></div></div>
<div id="report" class="card hidden"></div></section>
<section id="reviewView" class="view hidden"><div class="card"><h2>Review Queue</h2><p class="muted">Skills return after 1, 3, 7 and 14 days until they become stable.</p><div id="reviewList"></div></div></section>
<section id="progressView" class="view hidden"><div class="card"><h2>Writing Skill Map</h2><p id="stageText" class="muted"></p><div id="skillList"></div></div></section>
<section id="historyView" class="view hidden"><div class="card"><h2>Practice History</h2><div id="historyList"></div></div></section>
</main><script src="/app.js"></script></body></html>
